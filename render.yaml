# Описание сервиса для Render (Blueprint).
#
# Смысл файла: настройки размещения лежат в репозитории рядом с кодом,
# а не набираются руками в веб-панели. Разница видна, когда сервис
# надо поднять заново или повторить в другом окружении — здесь это
# один коммит, а не попытка вспомнить, что где было выставлено.
#
# Как применить: на render.com -> New -> Blueprint -> выбрать репозиторий.
# Переменную DATABASE_URL Render спросит при создании (sync: false) —
# туда идёт строка подключения к базе (см. ИНСТРУКЦИЯ_ДЕПЛОЙ.md).

services:
  - type: web
    name: gameport
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile

    # Куда стучаться, чтобы понять, поднялся ли сервис. Без этого
    # хостинг считает контейнер живым по факту запуска процесса —
    # то есть ещё до того, как приложение реально готово отвечать.
    healthCheckPath: /healthz

    envVars:
      # Строка подключения к PostgreSQL. sync: false означает
      # «спросить у человека при создании и не хранить в репозитории».
      # Пароль от базы в git — это пароль, который уже утёк.
      - key: DATABASE_URL
        sync: false

      # Наполнить пустую базу каталогом при первом старте.
      - key: SHOP_AUTO_SEED
        value: "1"

      # Демо-режим: раз в полчаса возвращать распроданные остатки.
      - key: SHOP_DEMO
        value: "1"

      # Сервис стоит за прокси Render — клиентский адрес приходит
      # заголовком X-Forwarded-For, и ему здесь можно верить.
      - key: SHOP_TRUST_PROXY
        value: "1"

      - key: PYTHONUNBUFFERED
        value: "1"
